<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Амфы — The Outlast Trials | Курилка Синьялы</title>
    <link rel="icon" href="../images/лого.png" type="image/png" sizes="64x64">
    <link rel="shortcut icon" href="../images/лого.png" type="image/png">
    <link rel="apple-touch-icon" href="../images/лого.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f0eef7;
            overflow: hidden;
            min-height: 100vh;
            height: 100vh;
            position: relative;
            background: radial-gradient(ellipse at 20% 30%, #0a0a0f 0%, #010101 100%);
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 2rem 3rem;
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ===== ЗАГОЛОВОК AMPS ===== */
        .amps-header {
            margin-bottom: 2rem;
        }

        .amps-header .title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e25d32, #ffbc9a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 60px rgba(220, 90, 50, 0.1);
            text-align: left;
        }

        /* ===== ОСНОВНАЯ СЕТКА ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 1.5rem;
            flex: 1;
            align-items: flex-start;
        }

        /* ===== ЛЕВАЯ КОЛОНКА - КАТЕГОРИИ ===== */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 650px;
            width: 100%;
        }

        .category-block {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(220, 90, 50, 0.15);
            border-radius: 24px;
            padding: 2.2rem 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 110px;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .category-block .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            z-index: 1;
            transition: background 0.3s ease;
        }

        .category-block:hover .bg-overlay {
            background: rgba(0, 0, 0, 0.45);
        }

        .category-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(220, 90, 50, 0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 24px;
            z-index: 2;
        }

        .category-block:hover::before {
            opacity: 1;
        }

        .category-block:hover {
            border-color: rgba(220, 90, 50, 0.4);
            transform: translateX(6px);
            box-shadow: 0 8px 35px rgba(220, 90, 50, 0.15);
        }

        .category-block .cat-content {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .category-block .cat-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f0eef7;
            letter-spacing: 2px;
        }

        .category-block .cat-arrow {
            color: #888;
            font-size: 1.6rem;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .category-block:hover .cat-arrow {
            opacity: 1;
            color: #e16d48;
            transform: translateX(4px);
        }

        .category-block.bg-tool { background-image: url('../images/amps/tool-bg.jpg'); }
        .category-block.bg-skill { background-image: url('../images/amps/skill-bg.jpg'); }
        .category-block.bg-medicine { background-image: url('../images/amps/medicine-bg.jpg'); }
        .category-block.bg-imposter { background-image: url('../images/amps/imposter-bg.jpg'); }

        /* ===== СРЕДНЯЯ КОЛОНКА - СПИСОК АМФ ===== */
        .amps-list-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(220, 90, 50, 0.1);
            padding: 0;
            max-height: 550px;
            overflow-y: auto;
            display: none;
            width: 100%;
        }

        .amps-list-container.active {
            display: block;
            animation: fadeInScale 0.3s ease-out;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        .amps-list-container::-webkit-scrollbar {
            width: 4px;
        }
        .amps-list-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .amps-list-container::-webkit-scrollbar-thumb { background: rgba(220, 90, 50, 0.3); border-radius: 10px; }

        .amps-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(220, 90, 50, 0.1);
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5;
            border-radius: 20px 20px 0 0;
        }

        .amps-list-header .list-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffbc9a;
        }

        .amps-list-header .list-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0.2rem 0.8rem;
            border-radius: 8px;
        }

        .amps-list-header .list-close:hover {
            color: #e16d48;
            background: rgba(220, 90, 50, 0.1);
        }

        .amp-item {
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
        }

        .amp-item:hover {
            background: rgba(220, 90, 50, 0.05);
        }

        .amp-item .amp-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 1.2rem;
            color: #e16d48;
        }

        .amp-item .amp-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .amp-item .amp-name {
            font-size: 0.95rem;
            color: #f0eef7;
            font-weight: 500;
        }

        .amp-item .amp-detail-btn {
            color: #555;
            font-size: 1rem;
            opacity: 0.4;
            transition: all 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .amp-item:hover .amp-detail-btn {
            opacity: 0.8;
            color: #e16d48;
        }

        .amp-item .amp-detail-btn:hover {
            opacity: 1;
            color: #e16d48;
            transform: scale(1.1);
        }

        .amp-item.active {
            background: rgba(220, 90, 50, 0.08);
            border-left: 3px solid #e16d48;
        }

        /* ===== ПРАВАЯ КОЛОНКА - ОПИСАНИЕ АМФЫ (СБОКУ) ===== */
        .amp-detail-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(220, 90, 50, 0.1);
            padding: 1.5rem;
            display: none;
            flex-direction: column;
            min-height: 350px;
            width: 100%;
        }

        .amp-detail-panel.active {
            display: flex;
            animation: fadeInScale 0.3s ease-out;
        }

        .amp-detail-panel .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #444;
            text-align: center;
        }

        .amp-detail-panel .empty-state i {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 0.8rem;
        }

        .amp-detail-panel .empty-state p {
            font-size: 0.85rem;
        }

        .amp-detail-panel .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .amp-detail-panel .detail-header .detail-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            font-size: 1.4rem;
            color: #e16d48;
        }

        .amp-detail-panel .detail-header .detail-icon img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .amp-detail-panel .detail-header .detail-title-group {
            flex: 1;
        }

        .amp-detail-panel .detail-header .detail-title-group .detail-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f0eef7;
        }

        .amp-detail-panel .detail-header .detail-title-group .detail-category {
            font-size: 0.65rem;
            color: #e16d48;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .amp-detail-panel .detail-body {
            flex: 1;
        }

        .amp-detail-panel .detail-body .detail-desc {
            color: #c2b9d4;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 0.8rem;
        }

        .amp-detail-panel .detail-body .detail-effect {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            border-left: 3px solid #e16d48;
            margin-bottom: 0.8rem;
        }

        .amp-detail-panel .detail-body .detail-effect .effect-label {
            font-size: 0.65rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .amp-detail-panel .detail-body .detail-effect .effect-text {
            color: #ffbc9a;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .amp-detail-panel .detail-body .detail-invasion {
            background: rgba(255, 50, 50, 0.05);
            border: 1px solid rgba(255, 50, 50, 0.15);
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            font-size: 0.75rem;
            color: #ff6666;
        }

        .amp-detail-panel .detail-body .detail-invasion i {
            margin-right: 6px;
        }

        .amp-detail-panel .detail-footer {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: flex-end;
        }

        .amp-detail-panel .detail-footer .purchase-btn {
            background: linear-gradient(135deg, #bc4627, #e25d32);
            border: none;
            padding: 0.5rem 2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .amp-detail-panel .detail-footer .purchase-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(188, 74, 40, 0.4);
        }

        /* ===== LISTEN КНОПКА ===== */
        .listen-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 1.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 1px;
            width: fit-content;
        }

        .listen-btn:hover {
            color: #e16d48;
            border-color: rgba(220, 90, 50, 0.3);
        }

        .listen-btn .key-hint {
            font-size: 0.6rem;
            color: #444;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.5rem;
            }
            .amp-detail-panel {
                grid-column: 1 / -1;
                min-height: 200px;
            }
        }

        @media (max-width: 992px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .category-list {
                max-width: 100%;
            }
            .amps-list-container {
                max-height: 350px;
            }
            .amp-detail-panel {
                min-height: 180px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                justify-content: flex-start;
                height: 100vh;
                overflow-y: auto;
            }
            .amps-header .title { font-size: 2.8rem; }
            .category-block {
                padding: 1.6rem 2rem;
                min-height: 85px;
                border-radius: 20px;
            }
            .category-block .cat-name { font-size: 1.6rem; }
            .category-block .cat-arrow { font-size: 1.3rem; }
            .amps-list-header .list-title { font-size: 1.1rem; }
            .amp-item { padding: 0.6rem 1rem; grid-template-columns: 40px 1fr 40px; }
            .amp-item .amp-icon { width: 32px; height: 32px; font-size: 1rem; }
            .amp-item .amp-name { font-size: 0.85rem; }
            .amp-detail-panel { padding: 1rem; min-height: 150px; }
        }

        @media (max-width: 500px) {
            .container { padding: 1rem; }
            .amps-header .title { font-size: 2.2rem; letter-spacing: 2px; }
            .category-list { gap: 1rem; }
            .category-block {
                padding: 1.2rem 1.5rem;
                min-height: 70px;
                border-radius: 16px;
            }
            .category-block .cat-name { font-size: 1.3rem; }
            .category-block .cat-arrow { font-size: 1.1rem; }
            .amps-list-header { padding: 0.6rem 1rem; }
            .amps-list-header .list-title { font-size: 1rem; }
            .amp-item { padding: 0.5rem 0.8rem; grid-template-columns: 36px 1fr 36px; }
            .amp-item .amp-icon { width: 28px; height: 28px; font-size: 0.8rem; }
            .amp-item .amp-name { font-size: 0.75rem; }
            .amp-detail-panel { padding: 0.8rem; min-height: 120px; }
            .amp-detail-panel .detail-body .detail-desc { font-size: 0.8rem; }
            .listen-btn { font-size: 0.8rem; padding: 0.3rem 0.8rem; }
        }
    </style>
</head>
<body>

<img class="background-image" src="../images/амфы-фон.webp" alt="Фон" onerror="this.style.display='none'">

<div class="overlay"></div>

<div class="container">
    <!-- ===== ЗАГОЛОВОК AMPS ===== -->
    <div class="amps-header">
        <span class="title">AMPS</span>
    </div>

    <!-- ===== ОСНОВНАЯ СЕТКА ===== -->
    <div class="main-grid">
        <!-- ===== ЛЕВАЯ КОЛОНКА - КАТЕГОРИИ ===== -->
        <div class="category-list">
            <div class="category-block bg-tool" data-category="tool">
                <div class="bg-overlay"></div>
                <div class="cat-content">
                    <span class="cat-name">TOOL</span>
                    <span class="cat-arrow"><i class="fas fa-chevron-right"></i></span>
                </div>
            </div>

            <div class="category-block bg-skill" data-category="skill">
                <div class="bg-overlay"></div>
                <div class="cat-content">
                    <span class="cat-name">SKILL</span>
                    <span class="cat-arrow"><i class="fas fa-chevron-right"></i></span>
                </div>
            </div>

            <div class="category-block bg-medicine" data-category="medicine">
                <div class="bg-overlay"></div>
                <div class="cat-content">
                    <span class="cat-name">MEDICINE</span>
                    <span class="cat-arrow"><i class="fas fa-chevron-right"></i></span>
                </div>
            </div>

            <div class="category-block bg-imposter" data-category="imposter">
                <div class="bg-overlay"></div>
                <div class="cat-content">
                    <span class="cat-name">IMPOSTER GADGETS</span>
                    <span class="cat-arrow"><i class="fas fa-chevron-right"></i></span>
                </div>
            </div>

            <a href="#" class="listen-btn">
                <i class="fas fa-headphones"></i>
                LISTEN
                <i class="fas fa-chevron-right"></i>
                <span class="key-hint">Esc EXIT</span>
            </a>
        </div>

        <!-- ===== СРЕДНЯЯ КОЛОНКА - СПИСОК АМФ ===== -->
        <div class="amps-list-container" id="ampsListContainer">
            <div class="amps-list-header">
                <span class="list-title" id="listTitle">TOOL</span>
                <button class="list-close" id="closeListBtn">&times;</button>
            </div>
            <div id="ampsItems">
                <!-- Амфы генерируются через JS -->
            </div>
        </div>

        <!-- ===== ПРАВАЯ КОЛОНКА - ОПИСАНИЕ АМФЫ (СБОКУ) ===== -->
        <div class="amp-detail-panel" id="ampDetailPanel">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-hand-pointer"></i>
                <p>Нажмите на стрелку у амфы<br>чтобы увидеть информацию</p>
            </div>
            <div class="detail-content" id="detailContent" style="display:none;">
                <div class="detail-header">
                    <div class="detail-icon" id="detailIcon">
                        <i class="fas fa-capsules"></i>
                    </div>
                    <div class="detail-title-group">
                        <div class="detail-name" id="detailName">Slippers</div>
                        <div class="detail-category" id="detailCategory">TOOL</div>
                    </div>
                </div>
                <div class="detail-body">
                    <div class="detail-desc" id="detailDesc">Описание амфы</div>
                    <div class="detail-effect">
                        <div class="effect-label">Эффект</div>
                        <div class="effect-text" id="detailEffectText">Эффект амфы</div>
                    </div>
                    <div class="detail-invasion" id="detailInvasion">
                        <i class="fas fa-skull"></i> <span id="detailInvasionText">Информация о вторжении</span>
                    </div>
                </div>
                <div class="detail-footer">
                    <button class="purchase-btn" id="purchaseBtn">PURCHASE</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============ ДАННЫЕ АМФ ============
    const ampsData = {
        tool: [
            { id: 1, name: 'Slippers', icon: 'fa-shoe-prints', 
              desc: 'You can walk on broken glass without making any noise.',
              effect: 'Walking on broken glass does not alert enemies.',

            { id: 2, name: 'Short Circuit', icon: 'fa-bolt',

              desc: 'Interact with objects and perform actions faster.',
              effect: 'Action speed increased by 25%.',

              desc: 'See enemy locations through walls when crouching.',

              invasion: 'Invaders are also highlighted.' }
        ],
        skill: [
            { id: 5, name: 'Adrenaline Rush', icon: 'fa-running',
              desc: 'Gain a speed boost after taking damage.',
              effect: 'Move 30% faster for 5 seconds after taking damage.',
              invasion: 'No effect on Invaders.' },
            { id: 6, name: 'Iron Will', icon: 'fa-shield-alt',
              desc: 'Resist fear and psychosis effects.',
              effect: 'Psychosis duration reduced by 40%.',
              invasion: 'No effect on Invaders.' },
            { id: 7, name: 'Stealthy', icon: 'fa-user-secret',
              desc: 'Move silently while crouched.',
              effect: 'Footstep noise reduced by 80%.',
              invasion: 'No effect on Invaders.' },
            { id: 8, name: 'Last Stand', icon: 'fa-fist-raised',
              desc: 'Increased damage when low on health.',
              effect: '50% more damage when below 20% health.',
              invasion: 'No effect on Invaders.' }
        ],
        medicine: [
            { id: 9, name: 'Healing Touch', icon: 'fa-heart',
              desc: 'Heal allies when reviving them.',
              effect: 'Revived allies gain 40% health.',
              invasion: 'No effect on Invaders.' },
            { id: 10, name: 'Pain Tolerance', icon: 'fa-shield-heart',
              desc: 'Take reduced damage from enemies.',
              effect: 'All damage reduced by 15%.',
              invasion: 'No effect on Invaders.' },
            { id: 11, name: 'Field Medic', icon: 'fa-briefcase-medical',
              desc: 'Use medical items more efficiently.',
              effect: 'Medical items restore 30% more health.',
              invasion: 'No effect on Invaders.' }
        ],
        imposter: [
            { id: 12, name: 'Imposter Sight', icon: 'fa-mask',
              desc: 'Detect Imposters from farther away.',
              effect: 'Imposter detection range increased by 50%.',
              invasion: 'Reveals Invaders on the map.' },
            { id: 13, name: 'Disguise Expert', icon: 'fa-cloak',
              desc: 'Mimic enemy behavior more convincingly.',
              effect: 'Reduces suspicion meter build-up.',
              invasion: 'Harder to detect as an Invader.' },
            { id: 14, name: 'Sabotage', icon: 'fa-wrench',
              desc: 'Disable nearby traps and devices.',
              effect: 'Traps are disabled for 15 seconds.',
              invasion: 'Affects Invader traps.' },
            { id: 15, name: 'Fake Death', icon: 'fa-skull',
              desc: 'Play dead to fool enemies.',
              effect: 'Enemies ignore you for 10 seconds.',
              invasion: 'Works on Invaders.' }
        ]
    };

    // ============ СОСТОЯНИЕ ============
    let currentCategory = null;
    let currentAmpId = null;

    // ============ ОТКРЫТИЕ СПИСКА АМФ ============
    function openAmpsList(category) {
        currentCategory = category;
        const container = document.getElementById('ampsListContainer');
        const title = document.getElementById('listTitle');
        const itemsContainer = document.getElementById('ampsItems');

        title.textContent = category.toUpperCase();

        const amps = ampsData[category] || [];
        itemsContainer.innerHTML = '';

        amps.forEach((amp) => {
            const div = document.createElement('div');
            div.className = 'amp-item';
            div.dataset.id = amp.id;

            const iconDiv = document.createElement('div');
            iconDiv.className = 'amp-icon';
            iconDiv.innerHTML = `<i class="fas ${amp.icon}"></i>`;

            const nameDiv = document.createElement('div');
            nameDiv.className = 'amp-name';
            nameDiv.textContent = amp.name;

            const detailBtn = document.createElement('button');
            detailBtn.className = 'amp-detail-btn';
            detailBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            detailBtn.title = 'Подробнее';
            detailBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                showAmpDetail(amp.id);
            });

            div.appendChild(iconDiv);
            div.appendChild(nameDiv);
            div.appendChild(detailBtn);

            div.addEventListener('click', function(e) {
                if (e.target.closest('.amp-detail-btn')) return;
                document.querySelectorAll('.amp-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                showAmpDetail(amp.id);
            });

            itemsContainer.appendChild(div);
        });

        // Если амфа была выбрана ранее, показываем её
        if (currentAmpId) {
            const found = amps.some(a => a.id === currentAmpId);
            if (found) {
                showAmpDetail(currentAmpId);
                document.querySelectorAll('.amp-item').forEach(el => {
                    el.classList.toggle('active', parseInt(el.dataset.id) === currentAmpId);
                });
            }
        }

        container.classList.add('active');

        if (window.innerWidth <= 992) {
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    }

    // ============ ПОКАЗАТЬ ОПИСАНИЕ АМФЫ (СБОКУ) ============
    function showAmpDetail(ampId) {
        currentAmpId = ampId;
        const panel = document.getElementById('ampDetailPanel');
        const emptyState = document.getElementById('emptyState');
        const content = document.getElementById('detailContent');

        // Находим амфу во всех категориях
        let amp = null;
        for (const cat in ampsData) {
            const found = ampsData[cat].find(a => a.id === ampId);
            if (found) { amp = found; break; }
        }

        if (!amp) return;

        // Скрываем пустое состояние, показываем контент
        emptyState.style.display = 'none';
        content.style.display = 'block';
        panel.classList.add('active');

        // Заполняем данные
        document.getElementById('detailIcon').innerHTML = `<i class="fas ${amp.icon}"></i>`;
        document.getElementById('detailName').textContent = amp.name;
        document.getElementById('detailCategory').textContent = amp.category || currentCategory?.toUpperCase() || 'TOOL';
        document.getElementById('detailDesc').textContent = amp.desc;
        document.getElementById('detailEffectText').textContent = amp.effect;
        document.getElementById('detailInvasionText').textContent = amp.invasion;
    }

    // ============ ЗАКРЫТИЕ СПИСКА ============
    function closeAmpsList() {
        document.getElementById('ampsListContainer').classList.remove('active');
        document.getElementById('ampDetailPanel').classList.remove('active');
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('detailContent').style.display = 'none';
        currentCategory = null;
        currentAmpId = null;
    }

    // ============ ОБРАБОТЧИКИ ============
    document.querySelectorAll('.category-block').forEach(block => {
        block.addEventListener('click', function() {
            const category = this.dataset.category;
            if (currentCategory === category && document.getElementById('ampsListContainer').classList.contains('active')) {
                closeAmpsList();
            } else {
                openAmpsList(category);
            }
        });
    });

    document.getElementById('closeListBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        closeAmpsList();
    });

    document.addEventListener('click', function(e) {
        const container = document.getElementById('ampsListContainer');
        const categoryList = document.querySelector('.category-list');
        const detailPanel = document.getElementById('ampDetailPanel');
        if (container.classList.contains('active') && 
            !container.contains(e.target) && 
            !categoryList.contains(e.target) &&
            !detailPanel.contains(e.target)) {
            closeAmpsList();
        }
    });

    // ===== ПЛАВНОЕ ПОЯВЛЕНИЕ =====
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.category-block, .amps-header, .listen-btn').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'all 0.6s ease-out';
            setTimeout(() => {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 100);
        });
    });
</script>

</body>
</html>
